name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - claude/app-feature-improvements-6rr2ur
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Blocks the deploy if the training/nutrition calculations regress.
      - run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy
        run: npx nitro deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Keeps the Worker's GEMINI_API_KEY secret in sync on every deploy —
      # a Cloudflare Worker secret is a separate store from GitHub Actions
      # secrets, so this can't be set just by adding it above; re-running
      # `secret put` with the same value is a harmless no-op.
      - name: Sync Gemini secret
        run: echo "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
        working-directory: .output/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
